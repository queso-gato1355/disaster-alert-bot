# 재난알림봇 — Synology Container Manager 용
# 이 파일과 같은 폴더에 .env 를 두세요 (.env.example 참고)
services:
  disaster-alert-bot:
    image: quesogato3924/disaster-alert-bot:latest
    container_name: disaster-alert-bot
    restart: unless-stopped
    env_file:
      - .env
    environment:
      TZ: Asia/Seoul
      DB_PATH: /app/data/bot.db
    volumes:
      - ./data:/app/data          # 서버 설정 · 발송기록 · API 사용량 (SQLite)
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"
    mem_limit: 256m
